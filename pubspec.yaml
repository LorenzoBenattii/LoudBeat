name: loud_beat
description: "Personal music player."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter

  extractor: ^1.0.0
  youtube_results: ^0.1.1
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  flutter_slidable: ^4.0.3
  just_audio: ^0.10.6
  audio_metadata_reader: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  

flutter:
  uses-material-design: true
  fonts:
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: fonts/Orbitron-Medium.ttf
          weight: 500
        - asset: fonts/Orbitron-SemiBold.ttf
          weight: 600
        - asset: fonts/Orbitron-Bold.ttf
          weight: 700
        - asset: fonts/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: fonts/Orbitron-Black.ttf
          weight: 900